name: iOS build and TestFlight

on:
  push:
    branches: [ios/testflight]
    tags: [ios-testflight-*]
  workflow_dispatch:
    inputs:
      upload:
        description: Upload a signed build to App Store Connect
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulator:
    name: Build and launch on an iPhone simulator
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Verify Xcode
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -1 | cut -d ' ' -f 2 | cut -d . -f 1)" = 26
      - run: npm ci
      - name: Build and bundle the game
        env:
          VITE_GHOST_API_URL: ${{ vars.VITE_GHOST_API_URL }}
        run: npm run ios:sync
      - name: Compile and launch the native app
        run: bash tools/ios-simulator.sh
      - name: Save simulator screenshot and build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inkrunner-iphone-simulator
          path: |
            ${{ runner.temp }}/inkrunner-simulator/*.png
            ${{ runner.temp }}/inkrunner-simulator/*.log
            ${{ runner.temp }}/inkrunner-simulator/*.json
            ${{ runner.temp }}/inkrunner-simulator/screenshots/*.png
            ${{ runner.temp }}/inkrunner-simulator/screenshots/*.txt
            ${{ runner.temp }}/inkrunner-simulator/screenshots/manifest.json
          if-no-files-found: ignore
          retention-days: 7

  testflight:
    name: Sign and upload to TestFlight
    needs: simulator
    if: startsWith(github.ref, 'refs/tags/ios-testflight-') || (github.event_name == 'workflow_dispatch' && inputs.upload)
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 25
    env:
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Check credentials
        run: python3 tools/ios-credentials.py check-ci
      - run: npm ci
      - name: Build and bundle the game
        env:
          VITE_GHOST_API_URL: ${{ vars.VITE_GHOST_API_URL }}
        run: npm run ios:sync
      - name: Archive, export, validate, and upload
        run: bash tools/ios-release.sh
      - name: Remove temporary signing credentials
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/inkrunner-signing/keychain-path" ]; then
            security delete-keychain "$(cat "$RUNNER_TEMP/inkrunner-signing/keychain-path")" || true
          fi
          if [ -f "$RUNNER_TEMP/inkrunner-signing/installed-profile" ]; then
            rm -f -- "$(cat "$RUNNER_TEMP/inkrunner-signing/installed-profile")"
          fi
          rm -rf -- "$RUNNER_TEMP/inkrunner-signing"
      - name: Save the upload summary and build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inkrunner-testflight-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/inkrunner-release/export/*.plist
            ${{ runner.temp }}/inkrunner-release/*.log
          if-no-files-found: ignore
          retention-days: 7
